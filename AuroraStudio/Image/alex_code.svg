      </g>
    </g>
    <!-- subtle glow -->
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g transform="translate(820,540)" filter="url(#glow)" opacity="0.9">
      <circle r="28" fill="#6de6d1" opacity="0.12"/>
      <circle r="16" fill="#8bc6ff" opacity="0.14"/>
    </g>
  </g>
</svg>