<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="800" fill="#071026" />
  <g transform="translate(80,80)">
    <rect width="1040" height="640" rx="14" fill="#041423" stroke="#2b2f45" stroke-width="2" />
    <g transform="translate(36,36)">
      <!-- mock code lines -->
      <rect y="0" width="820" height="12" rx="6" fill="#a6e3ff" opacity="0.08" />
      <rect y="28" width="760" height="10" rx="5" fill="#8be7d6" opacity="0.07" />
      <rect y="52" width="900" height="10" rx="5" fill="#ffd97d" opacity="0.06" />
      <rect y="76" width="540" height="10" rx="5" fill="#c6b7ff" opacity="0.065" />
      <rect y="104" width="980" height="10" rx="5" fill="#8be7d6" opacity="0.05" />
      <rect y="128" width="620" height="10" rx="5" fill="#a6e3ff" opacity="0.06" />
      <rect y="156" width="880" height="10" rx="5" fill="#ffd97d" opacity="0.05" />
      <!-- purple accent bracket -->
      <rect x="-28" y="-12" width="20" height="540" rx="6" fill="rgba(147,112,219,0.12)" />
      <g transform="translate(720,12)">
        <rect width="200" height="36" rx="8" fill="rgba(147,112,219,0.14)"/>
